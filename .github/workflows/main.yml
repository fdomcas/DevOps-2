name: Test SSH Key

on:
  push:
    branches: [ main ]

jobs:
  test-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test SSH key from secret
        run: |
          echo "=== Creating key from secret ==="
          echo "${{ secrets.AWS_PRIVATEKEY }}" > /tmp/key_from_secret.pem
          chmod 600 /tmp/key_from_secret.pem
          
          echo ""
          echo "=== SSH-KEYGEN TEST ==="
          ssh-keygen -l -f /tmp/key_from_secret.pem
          
          echo ""
          echo "=== SHA256 HASH ==="
          sha256sum /tmp/key_from_secret.pem
          
          echo ""
          echo "=== Primeras 5 lineas ==="
          sed -n '1,5p' /tmp/key_from_secret.pem
          
          echo ""
          echo "=== Ultimas 5 lineas ==="
          sed -n '$-5,$p' /tmp/key_from_secret.pem
